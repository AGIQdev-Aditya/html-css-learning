<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#161c28"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#131824"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>

  <!-- Grid Lines -->
  <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250" stroke="#1f293d" stroke-width="1"/>
  <path d="M 50 0 L 50 300 M 100 0 L 100 300 M 150 0 L 150 300 M 200 0 L 200 300 M 250 0 L 250 300 M 300 0 L 300 300 M 350 0 L 350 300" stroke="#1f293d" stroke-width="1"/>

  <!-- Traces (Gold) -->
  <path d="M 50 80 L 120 80 L 150 110" stroke="#c9b59c" stroke-width="2" fill="none"/>
  <circle cx="50" cy="80" r="4" fill="#c9b59c"/>

  <path d="M 350 80 L 280 80 L 250 110" stroke="#c9b59c" stroke-width="2" fill="none"/>
  <circle cx="350" cy="80" r="4" fill="#c9b59c"/>

  <path d="M 50 220 L 120 220 L 150 190" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <circle cx="50" cy="220" r="4" fill="#3b82f6"/>

  <path d="M 350 220 L 280 220 L 250 190" stroke="#10b981" stroke-width="2" fill="none"/>
  <circle cx="350" cy="220" r="4" fill="#10b981"/>

  <!-- Central Silicon IC Chip -->
  <rect x="130" y="90" width="140" height="120" rx="8" fill="url(#chip)" stroke="#334155" stroke-width="2"/>

  <!-- IC Pins (Top & Bottom) -->
  <g fill="#c9b59c">
    <rect x="150" y="82" width="8" height="8" rx="1"/>
    <rect x="170" y="82" width="8" height="8" rx="1"/>
    <rect x="190" y="82" width="8" height="8" rx="1"/>
    <rect x="210" y="82" width="8" height="8" rx="1"/>
    <rect x="230" y="82" width="8" height="8" rx="1"/>

    <rect x="150" y="210" width="8" height="8" rx="1"/>
    <rect x="170" y="210" width="8" height="8" rx="1"/>
    <rect x="190" y="210" width="8" height="8" rx="1"/>
    <rect x="210" y="210" width="8" height="8" rx="1"/>
    <rect x="230" y="210" width="8" height="8" rx="1"/>
  </g>

  <!-- Chip Core Text -->
  <text x="200" y="145" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">NEXCAN_QFP48</text>
  <text x="200" y="165" font-family="monospace" font-size="9" fill="#c9b59c" text-anchor="middle">SPECIMEN BATCH A1</text>
  <text x="200" y="180" font-family="sans-serif" font-size="8" fill="#10b981" text-anchor="middle">● 0.42mm NOMINAL</text>

  <!-- Title Badge -->
  <rect x="110" y="25" width="180" height="24" rx="12" fill="rgba(201, 181, 156, 0.15)" stroke="rgba(201, 181, 156, 0.3)" stroke-width="1"/>
  <text x="200" y="41" font-family="monospace" font-size="10" font-weight="bold" fill="#c9b59c" text-anchor="middle">OFFLINE_SPECIMEN_01.SVG</text>
</svg>
